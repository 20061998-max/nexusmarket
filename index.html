<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusMarket - E-books, Apps & Marketplace</title>
    <script src="https://tailwindcss.com"></script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .text-gradient { background: linear-gradient(135deg, #a855f7 0%, #3b82f6 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="bg-[#0b0f19] text-gray-100 font-sans antialiased overflow-x-hidden">

    <!-- BARRA DE NAVEGAÇÃO -->
    <nav class="fixed top-0 left-0 w-full z-50 glass border-b border-gray-800 px-6 py-4 flex justify-between items-center">
        <div class="text-2xl font-black tracking-wider text-gradient">NEXUS<span class="text-white">MARKET</span></div>
        <div id="authSection" class="flex items-center space-x-4">
            <button id="btnLogin" class="text-sm font-semibold px-4 py-2 text-gray-300 hover:text-white transition">Entrar com Google</button>
            <a href="anunciar.html" class="text-sm font-semibold bg-gradient-to-r from-purple-600 to-blue-600 hover:opacity-90 transition px-5 py-2.5 rounded-full shadow-lg">Anunciar Agora</a>
        </div>
    </nav>

    <!-- TOPO DO SITE (HERO) -->
    <header class="relative pt-32 pb-10 px-6 max-w-7xl mx-auto text-center flex flex-col items-center justify-center min-h-[60vh]">
        <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-purple-600/10 rounded-full blur-[120px] pointer-events-none"></div>
        <span class="px-4 py-1.5 rounded-full glass text-xs font-semibold text-purple-400 uppercase tracking-widest mb-6 block border border-purple-500/30">Nova Era Digital</span>
        <h1 class="text-4xl md:text-7xl font-black tracking-tight max-w-4xl leading-tight mb-6">O Hub Definitivo para <br><span class="text-gradient">E-books e Softwares</span></h1>
        <p class="text-gray-400 text-lg max-w-2xl mb-8">Adquira soluções exclusivas ou anuncie seus próprios infoprodutos lucrando direto na sua conta.</p>
    </header>

    <!-- GRADE DE PRODUTOS DINÂMICOS -->
    <section class="py-16 px-6 max-w-7xl mx-auto">
        <h2 class="text-3xl font-extrabold mb-12 border-l-4 border-purple-500 pl-4">Produtos Disponíveis</h2>
        <div id="gridProdutos" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <p class="text-gray-500 col-span-full text-center py-10">Carregando mercado digital...</p>
        </div>
    </section>

    <!-- INTEGRAÇÃO DIRETA COM O SEU FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://gstatic.com";
        import { getFirestore, collection, getDocs, query, orderBy } from "https://gstatic.com";

        // Suas chaves reais configuradas
        const firebaseConfig = {
            apiKey: "AIzaSyCCW26RvgXvp_0q-kkg2QRU6m0MP9li9xs",
            authDomain: "://firebaseapp.com",
            projectId: "meusite-8eaff",
            storageBucket: "meusite-8eaff.firebasestorage.app",
            messagingSenderId: "835005102225",
            appId: "1:835005102225:web:c4c612b03ceeaf44136730",
            measurementId: "G-EZG50LPV0M"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        const btnLogin = document.getElementById('btnLogin');
        const gridProdutos = document.getElementById('gridProdutos');
        const authSection = document.getElementById('authSection');

        if(btnLogin) {
            btnLogin.addEventListener('click', () => {
                signInWithPopup(auth, provider).catch(error => console.error("Erro login:", error));
            });
        }

        // Monitorar se o usuário está logado
        onAuthStateChanged(auth, (user) => {
            if (user) {
                authSection.innerHTML = `
                    <span class="text-sm text-gray-400 hidden sm:inline font-semibold">Olá, ${user.displayName.split(' ')[0]}</span>
                    <a href="anunciar.html" class="text-sm font-semibold bg-gradient-to-r from-purple-600 to-blue-600 transition px-5 py-2.5 rounded-full shadow-md">Anunciar</a>
                    <button id="btnLogout" class="text-xs text-red-400 hover:underline ml-2">Sair</button>
                `;
                document.getElementById('btnLogout').addEventListener('click', () => signOut(auth));
            }
        });

        // Buscar produtos salvos do banco de dados em tempo real
        async function carregarProdutos() {
            try {
                const q = query(collection(db, "produtos"), orderBy("criadoEm", "desc"));
                const querySnapshot = await getDocs(q);
                gridProdutos.innerHTML = "";

                if(querySnapshot.empty) {
                    gridProdutos.innerHTML = `<p class="text-gray-500 col-span-full text-center py-10">Nenhum produto anunciado ainda. Seja o primeiro!</p>`;
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const p = doc.data();
                    const badgeColor = p.categoria === 'ebook' ? 'bg-blue-500/10 text-blue-400 border-blue-500/20' : 'bg-purple-500/10 text-purple-400 border-purple-500/20';
                    const icone = p.categoria === 'ebook' ? '📚' : '💻';
                    
                    gridProdutos.innerHTML += `
                        <div class="glass p-6 rounded-2xl relative overflow-hidden group hover:border-purple-500/30 transition-all duration-300 flex flex-col justify-between shadow-xl">
                            <div>
                                <div class="flex justify-between items-start mb-4">
                                    <span class="text-[10px] font-bold px-2.5 py-1 rounded uppercase border ${badgeColor}">${icone} ${p.categoria}</span>
                                    <span class="text-xs text-gray-500">Membro Nexus</span>
                                </div>
                                <h3 class="text-xl font-bold mb-2 text-white line-clamp-1">${p.titulo}</h3>
                                <p class="text-gray-400 text-xs mb-6 line-clamp-3 leading-relaxed">${p.descricaoCurta}</p>
                            </div>
                            <div class="flex items-center justify-between pt-4 border-t border-gray-800/60 mt-auto">
                                <div>
                                    <span class="text-gray-500 text-[10px] block uppercase tracking-wider">Valor</span>
                                    <span class="text-xl font-black text-white">R$ ${parseFloat(p.preco).toFixed(2)}</span>
                                </div>
                                <a href="${p.arquivoUrl}" target="_blank" class="bg-gradient-to-r from-purple-600 to-blue-600 text-white font-bold px-4 py-2 rounded-xl text-xs hover:opacity-90 transition shadow-md">Comprar / Acessar</a>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                console.error("Erro ao carregar produtos:", err);
                gridProdutos.innerHTML = `<p class="text-red-400 col-span-full text-center py-10">Erro ao sincronizar com o banco de dados.</p>`;
            }
        }
        carregarProdutos();
    </script>
</body>
          </html>
